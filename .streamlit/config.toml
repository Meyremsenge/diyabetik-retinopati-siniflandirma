# VisionDx demo ayarları (PLAN 5.2). Streamlit bu dosyayı proje kökünden çalıştırınca okur.

[theme]
base = "light"
primaryColor = "#0E5E57"
backgroundColor = "#F4F3EF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14211F"
font = "sans serif"

[client]
# "Deploy" gibi geliştirici seçeneklerini gizler (araç çubuğu app/style.css ile de gizlenir)
toolbarMode = "minimal"

[browser]
# Kullanım istatistiği dış servise gönderilmez
gatherUsageStats = false

[server]
# Yüklenebilecek en büyük dosya (MB)
maxUploadSize = 20
# "Dosya değişti" uyarısını kapatır; kod değişince uygulama yeniden başlatılır
fileWatcherType = "none"
